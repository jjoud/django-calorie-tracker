{% extends 'layouts/base.html' %}

{% block title %}Add Meal | CalorieTrack{% endblock %}

{% block content %}
<section class="section-heading">
    <p class="eyebrow">Track calories</p>
    <h1>Add Meal</h1>
    <a class="button button-secondary" href="{% url 'calories:food_list' %}">Manage Foods</a>
</section>

<section class="panel narrow">
    <form method="post" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Add Meal</button>
    </form>
</section>
{% endblock %}
