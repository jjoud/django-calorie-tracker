{% extends 'layouts/base.html' %}

{% block title %}Login | CalorieTrack{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Login</h1>
    <form method="post" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Login</button>
    </form>
    <p class="muted">New here? <a href="{% url 'accounts:register' %}">Create an account</a>.</p>
</section>
{% endblock %}
