<header class="site-header">
    <nav class="nav">
        <a class="brand" href="{% url 'dashboard:landing' %}">
            <span class="brand-mark">C</span>
            <span>CalorieTrack</span>
        </a>

        <button class="nav-toggle" type="button" data-nav-toggle aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" data-nav-menu>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard:dashboard' %}">Dashboard</a>
                <a href="{% url 'calories:add_meal' %}">Add Meal</a>
                <a href="{% url 'calories:food_list' %}">Food Database</a>
                <a href="{% url 'calories:history' %}">History</a>
                <a href="{% url 'accounts:settings' %}">Goal</a>
                <form class="logout-form" method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="link-button" type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Login</a>
                <a class="button button-small" href="{% url 'accounts:register' %}">Get Started</a>
            {% endif %}
        </div>
    </nav>
</header>
